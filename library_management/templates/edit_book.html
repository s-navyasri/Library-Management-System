{% extends "base.html" %}
{% block title %}Edit Book - Library Management System{% endblock %}

{% block content %}
    <h1>Edit Book</h1>

    <form class="form-card" method="post" action="{{ url_for('edit_book', book_id=book.id) }}">
        <label for="title">Title *</label>
        <input type="text" id="title" name="title" value="{{ book.title }}" required>

        <label for="author">Author *</label>
        <input type="text" id="author" name="author" value="{{ book.author }}" required>

        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" name="isbn" value="{{ book.isbn or '' }}">

        <label for="quantity">Quantity *</label>
        <input type="number" id="quantity" name="quantity" min="1" value="{{ book.quantity }}" required>

        <div class="form-actions">
            <button type="submit" class="btn">Update Book</button>
            <a class="btn secondary" href="{{ url_for('books') }}">Cancel</a>
        </div>
    </form>
{% endblock %}

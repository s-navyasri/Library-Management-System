{% extends "base.html" %}
{% block title %}Add Member - Library Management System{% endblock %}

{% block content %}
    <h1>Add New Member</h1>

    <form class="form-card" method="post" action="{{ url_for('add_member') }}">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone">

        <div class="form-actions">
            <button type="submit" class="btn">Save Member</button>
            <a class="btn secondary" href="{{ url_for('members') }}">Cancel</a>
        </div>
    </form>
{% endblock %}

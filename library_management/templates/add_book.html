{% extends "base.html" %}
{% block title %}Add Book - Library Management System{% endblock %}

{% block content %}
    <h1>Add New Book</h1>

    <form class="form-card" method="post" action="{{ url_for('add_book') }}">
        <label for="title">Title *</label>
        <input type="text" id="title" name="title" required>

        <label for="author">Author *</label>
        <input type="text" id="author" name="author" required>

        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" name="isbn">

        <label for="quantity">Quantity *</label>
        <input type="number" id="quantity" name="quantity" min="1" value="1" required>

        <div class="form-actions">
            <button type="submit" class="btn">Save Book</button>
            <a class="btn secondary" href="{{ url_for('books') }}">Cancel</a>
        </div>
    </form>
{% endblock %}
